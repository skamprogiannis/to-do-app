<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Do It</title>
  <script defer src="main.js"></script></head>
  <body>
    <header>
      <div class="header-btns">
        <button id="toggle-sidebar" class="toggle-btn">
          <img src="fce5b2cc745bdbc5d438.png" />
        </button>
        <button id="toggle-theme" class="toggle-btn">
          <img src="4b9151170a13622f8bb8.png" />
        </button>
      </div>
      <div class="branding">
        <div class="name">
          <h1>Do It</h1>
          <img src="fdf7d199b820985d6215.png" />
        </div>
        <p class="shia-surprise">Don't Let Your Dreams Be Dreams</p>
      </div>
    </header>
    <main>
      <aside class="sidebar">
        <nav>
          <section class="home">
            <h2>Home</h2>
            <ul>
                <li><button class="today-btn">Today</button></li>
                <li><button class="next-7-days-btn">Next 7 Days</button></li>
                <li><button class="all-tasks-btn">All Tasks</button></li>
                <li><button class="important-btn">Important</button></li>
            </ul>
          </section>
          <section class="projects">
            <h2>My Projects</h2>
            <ul class="project-list">
            </ul>
            <button class="add-project">＋ Add Project</button>
          </section>
        </nav>
      </aside>
      <section class="tasks-section">
      </section>
    </main>
  </body>
</html>
