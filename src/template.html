<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Do It</title>
  </head>
  <body>
    <header>
      <div class="branding">
        <div class="name">
          <h1>Do It</h1>
          <img src="../public/images/done_outline_32dp.png" />
        </div>
        <p class="shia-surprise">Don't Let Your Dreams Be Dreams</p>
      </div>
      <div class="header-btns">
        <button id="toggle-sidebar" class="toggle-btn">
          <img src="../public/images/dock_to_right_26dp.png" />
        </button>
        <button id="toggle-theme" class="toggle-btn">
          <img src="../public/images/dark_mode_26dp.png" />
        </button>
      </div>
    </header>
    <main>
      <aside class="sidebar">
        <nav>
          <section class="home">
            <h2>Home</h2>
            <ul>
              <li><button>Today</button></li>
              <li><button>Next 7 Days</button></li>
              <li><button>All Tasks</button></li>
              <li><button>Important</button></li>
            </ul>
          </section>
          <section class="projects">
            <h2>My Projects</h2>
            <ul class="project-list">
            </ul>
            <button class="add-project">＋ Add Project</button>
          </section>
        </nav>
      </aside>
      <section class="tasks-section">
      </section>
    </main>
  </body>
</html>
